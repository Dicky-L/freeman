services:
  app:
    build: .
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-10}
      STREAM_IDLE_TIMEOUT_SECONDS: ${STREAM_IDLE_TIMEOUT_SECONDS:-30}
    expose:
      - "8000"

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - app
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
