name: AI Reliability Lab CI

on:
  push:
    paths:
      - 'portfolio/ai-pipeline-reliability-lab/**'
      - '.github/workflows/ai-reliability-lab.yml'
  pull_request:
    paths:
      - 'portfolio/ai-pipeline-reliability-lab/**'
      - '.github/workflows/ai-reliability-lab.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/ai-pipeline-reliability-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: portfolio/ai-pipeline-reliability-lab/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
